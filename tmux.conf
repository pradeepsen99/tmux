# Terminal

# Enable true colour support for xterm-compatible terminals.
set-option -sa terminal-overrides ",xterm*:Tc"

# Advertise tmux's 256-colour terminal definition inside panes.
set -g default-terminal "tmux-256color"

# Prefix And Key Bindings

# Use C-a as the tmux prefix, replacing the default C-b.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Jump to the most recently active window.
bind p last-window

# Create new windows and splits from the active pane's directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Open floating popups in the active pane's directory.
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind t display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "tas --pick"

# Mouse

# Enable mouse support while leaving drag selection to the terminal.
set -g mouse on
unbind -n MouseDrag1Pane
unbind -Tcopy-mode MouseDrag1Pane

# Status Bar

# Keep the status bar at the top of the terminal.
set -g status-position top

# Set base colours, widths, and left/right status segments.
# Glyphs in these formats require a Nerd Font or compatible Powerline font.
set -g status-style "fg=colour250,bg=colour236"
set -g status-left-length 80
set -g status-right-length 80
set -g status-left "#[fg=colour16,bg=colour46,bold]  #(git -C #{q:pane_current_path} branch --show-current 2>/dev/null)  #[fg=colour46,bg=colour238]#[fg=colour250,bg=colour238,nobold]  #{s|^.*/([^/]+/[^/]+)$|\\1|;s|^/||:pane_current_path} #[fg=colour238,bg=colour236]"
# Refresh every 2s so the tas agent counts (live / need you / idle) stay current.
set -g status-interval 2
set -g status-right "#[fg=colour238,bg=colour236]#[fg=colour250,bg=colour238] #(tas --status) #[fg=colour45,bg=colour238]#[fg=colour16,bg=colour45,bold] #S | %a %H:%M "

# Center and style window tabs with Powerline separators.
set -g status-justify absolute-centre
set -g window-status-separator ""
set -g window-status-style "fg=colour250,bg=colour236"
set -g window-status-format "#[fg=colour238,bg=colour236]#[fg=colour250,bg=colour238] #I:#W#{?window_flags, #F,} #[fg=colour238,bg=colour236]"
set -g window-status-current-style "fg=colour16,bg=colour236,bold"
set -g window-status-current-format "#[fg=colour33,bg=colour236]#[fg=colour16,bg=colour33,bold] #I:#W#{?window_flags, #F,} #[fg=colour33,bg=colour236]"

# Set vim bindings
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
