# Terminal

# Enable true colour support for xterm-compatible terminals.
set-option -sa terminal-overrides ",xterm*:Tc"

# Advertise tmux's 256-colour terminal definition inside panes.
set -g default-terminal "tmux-256color"

# Clipboard: send copied text to Ghostty (and the macOS clipboard) via OSC 52.
set -g set-clipboard on
set -as terminal-features ',xterm-ghostty:clipboard'

# Pass program-printed hyperlinks (OSC 8) through to Ghostty.
set -as terminal-features ',xterm-ghostty:hyperlinks'

# Prefix And Key Bindings

# Use C-a as the tmux prefix, replacing the default C-b.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Jump to the most recently active window.
bind p last-window

# Create new windows and splits from the active pane's directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Open floating popups in the active pane's directory.
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind t display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "tas --pick"

# Windows And Sessions

# Number windows from 1 so they match the keyboard, and close gaps when one is killed.
set -g base-index 1
set -g renumber-windows on

# When a session ends, switch to another one instead of detaching from tmux.
set -g detach-on-destroy off

# Project sessions: pick a project and switch to its session, creating it if needed.
# Open projects are listed first; C-x in the picker closes the highlighted session.
bind f display-popup -E -w 60% -h 60% "~/.config/tmux/scripts/sessionizer"

# Machine-Local Settings

# Per-machine settings live in local.conf (not tracked by git). Set the project
# roots there; they are colon-separated, and git repositories up to four levels
# below each root are listed as projects:
#   set -g @sessionizer-roots "$HOME/work:$HOME/src"
source-file -q ~/.config/tmux/local.conf

# Use the terminal's own background in popups instead of tmux's default grey.
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "fg=colour33,bg=default"
set -g popup-border-lines rounded

# Mouse

# Enable mouse support; dragging selects within the pane via copy mode.
# Hold Shift while dragging for Ghostty's native selection instead.
set -g mouse on

# Copy Mode

# Use vi keys: v starts a selection, C-v toggles block mode, y copies and exits.
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Status Bar

# Keep the status bar at the top of the terminal.
set -g status-position top

# Set base colours, widths, and left/right status segments.
# Glyphs in these formats require a Nerd Font or compatible Powerline font.
set -g status-style "fg=colour250,bg=colour236"
set -g status-left-length 80
set -g status-right-length 80
set -g status-left "#[fg=colour16,bg=colour46,bold]  #(git -C #{q:pane_current_path} branch --show-current 2>/dev/null)  #[fg=colour46,bg=colour238]#[fg=colour250,bg=colour238,nobold]  #{s|^.*/([^/]+/[^/]+)$|\\1|;s|^/||:pane_current_path} #[fg=colour238,bg=colour236]"
# Refresh every 2s so the tas agent counts (live / need you / idle) stay current.
set -g status-interval 2
set -g status-right "#[fg=colour238,bg=colour236]#[fg=colour250,bg=colour238] #(tas --status) #[fg=colour45,bg=colour238]#[fg=colour16,bg=colour45,bold] #S | %a %H:%M "

# Center and style window tabs with Powerline separators.
set -g status-justify absolute-centre
set -g window-status-separator ""
set -g window-status-style "fg=colour250,bg=colour236"
set -g window-status-format "#[fg=colour238,bg=colour236]#[fg=colour250,bg=colour238] #I:#W#{?window_flags, #F,} #[fg=colour238,bg=colour236]"
set -g window-status-current-style "fg=colour16,bg=colour236,bold"
set -g window-status-current-format "#[fg=colour33,bg=colour236]#[fg=colour16,bg=colour33,bold] #I:#W#{?window_flags, #F,} #[fg=colour33,bg=colour236]"

# Set vim bindings
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g focus-events on
